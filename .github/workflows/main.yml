name: Build REAL VISUAL TIM JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack and Build JAR
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p work
            unzip -o "*.zip" -d work
            PROJ_DIR=$(dirname "$(find work -name 'build.gradle' | head -n 1)")
          else
            PROJ_DIR=$(dirname "$(find . -maxdepth 3 -name 'build.gradle' | head -n 1)")
          fi
          echo "Building in: $PROJ_DIR"
          cd "$PROJ_DIR"

          # Автоматически получаем актуальные версии Fabric API и Loader для 1.21.11
          FABRIC_API_VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\+1\.21\.11' | tail -n 1)
          LOADER_VER=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -oE '<release>[^<]+</release>' | sed 's/<[^>]*>//g')

          echo "Detected Fabric API: $FABRIC_API_VER"
          echo "Detected Fabric Loader: $LOADER_VER"

          if [ -n "$FABRIC_API_VER" ]; then
            sed -i "s/^fabric_version=.*/fabric_version=$FABRIC_API_VER/" gradle.properties
          fi
          if [ -n "$LOADER_VER" ]; then
            sed -i "s/^loader_version=.*/loader_version=$LOADER_VER/" gradle.properties
          fi

          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/output_jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/output_jars/"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-visual-tim-jar
          path: output_jars/*.jar
