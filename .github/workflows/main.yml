name: Build REAL VISUAL TIM JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack and Build JAR
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p work
            unzip -o "*.zip" -d work
            PROJ_DIR=$(dirname "$(find work -name 'build.gradle' | head -n 1)")
          else
            PROJ_DIR=$(dirname "$(find . -maxdepth 3 -name 'build.gradle' | head -n 1)")
          fi
          echo "Building in: $PROJ_DIR"
          cd "$PROJ_DIR"

          python3 - << 'EOF'
          import json, re, urllib.request

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "RealVisualTimBuilder/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8")

          # 1. Актуальный Fabric API для 1.21.11 с Modrinth
          api_ver = None
          try:
              data = json.loads(fetch('https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D'))
              if data:
                  api_ver = data[0]["version_number"]
          except Exception as e:
              print("Modrinth check failed:", e)

          # Запасной поиск через Maven Fabric
          if not api_ver:
              xml = fetch("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml")
              matches = re.findall(r"<version>([^<]*1\.21\.11[^<]*)</version>", xml)
              if matches:
                  api_ver = matches[-1]
              else:
                  all_vers = re.findall(r"<version>([^<]+)</version>", xml)
                  print("Latest Fabric API versions on Maven:", all_vers[-10:])

          # 2. Актуальный Fabric Loader
          loader_ver = None
          try:
              loaders = json.loads(fetch("https://meta.fabricmc.net/v2/versions/loader"))
              loader_ver = loaders[0]["version"]
          except Exception as e:
              print("Loader check failed:", e)

          # 3. Актуальный Fabric Loom
          loom_ver = None
          try:
              xml = fetch("https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml")
              m = re.search(r"<release>([^<]+)</release>", xml)
              if m:
                  loom_ver = m.group(1)
          except Exception as e:
              print("Loom check failed:", e)

          print("Detected Fabric API:", api_ver)
          print("Detected Fabric Loader:", loader_ver)
          print("Detected Fabric Loom:", loom_ver)

          with open("gradle.properties", "r", encoding="utf-8") as f:
              props = f.read()
          if api_ver:
              props = re.sub(r"(?m)^fabric_version=.*$", f"fabric_version={api_ver}", props)
          if loader_ver:
              props = re.sub(r"(?m)^loader_version=.*$", f"loader_version={loader_ver}", props)
          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write(props)

          if loom_ver:
              with open("build.gradle", "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = re.sub(r"id 'fabric-loom' version '[^']+'", f"id 'fabric-loom' version '{loom_ver}'", bg)
              with open("build.gradle", "w", encoding="utf-8") as f:
                  f.write(bg)

          print("--- gradle.properties ---")
          print(props)
          EOF

          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/output_jars"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/output_jars/"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-visual-tim-jar
          path: output_jars/*.jar
